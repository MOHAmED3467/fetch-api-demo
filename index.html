<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fetch API Example</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🛍️ Fetch API Demo</h1>

    <div class="card">
      <h2>Using .then()</h2>
      <img id="then-img" src="" alt="Product Image">
      <p id="then-result">Loading...</p>
      <p id="then-price"></p>
    </div>

    <div class="card">
      <h2>Using async/await</h2>
      <img id="async-img" src="" alt="Product Image">
      <p id="async-result">Loading...</p>
      <p id="async-price"></p>
    </div>

    <button id="refresh-btn">🔄 Refresh Product</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
